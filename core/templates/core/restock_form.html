{% extends "core/base.html" %}
{% block title %}Restock - {{ stock_item.name }} - Atoka{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Restock: {{ stock_item.name }}</h1>
</div>
<div class="form-card">
    <div class="info-row">
        <span class="info-label">Current Stock:</span>
        <span class="info-value">{{ stock_item.quantity|floatformat:2 }} {{ stock_item.get_unit_display }}</span>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="add_quantity">Quantity to Add</label>
            <input type="number" id="add_quantity" name="add_quantity" step="0.01" min="0.01" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Restock</button>
            <a href="{% url 'stock_dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
