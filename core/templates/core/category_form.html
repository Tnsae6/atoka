{% extends "core/base.html" %}
{% block title %}{% if category %}Edit Category{% else %}New Category{% endif %} - Atoka{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{% if category %}Edit Category{% else %}New Category{% endif %}</h1>
</div>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ category.name|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ category.description|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label for="sort_order">Sort Order</label>
            <input type="number" id="sort_order" name="sort_order" value="{{ category.sort_order|default:'0' }}">
        </div>
        <div class="form-group form-check">
            <input type="checkbox" id="is_active" name="is_active" {% if category.is_active or not category %}checked{% endif %}>
            <label for="is_active">Active</label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
