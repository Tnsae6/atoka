{% extends "core/base.html" %}
{% block title %}Add Stock Item - Atoka{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Stock Item</h1>
</div>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Coffee Beans, Sugar, Milk" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="e.g. Beverages, Dry Goods">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="quantity">Initial Quantity</label>
                <input type="number" id="quantity" name="quantity" step="0.01" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="unit">Unit</label>
                <select id="unit" name="unit">
                    <option value="pcs">Pieces</option>
                    <option value="kg">Kilograms</option>
                    <option value="g">Grams</option>
                    <option value="l">Liters</option>
                    <option value="ml">Milliliters</option>
                    <option value="btl">Bottles</option>
                    <option value="pkg">Packages</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="price_per_unit">Price per Unit (Birr)</label>
                <input type="number" id="price_per_unit" name="price_per_unit" step="0.01" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="low_stock_threshold">Low Stock Threshold</label>
                <input type="number" id="low_stock_threshold" name="low_stock_threshold" step="0.01" min="0" value="10">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Stock Item</button>
            <a href="{% url 'stock_dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
