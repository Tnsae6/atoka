{% extends "core/base.html" %}
{% block title %}{% if product %}Edit Product{% else %}New Product{% endif %} - Atoka{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{% if product %}Edit Product{% else %}New Product{% endif %}</h1>
</div>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" value="{{ product.name|default:'' }}" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Select category...</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="price">Price (Birr)</label>
                <input type="number" id="price" name="price" step="0.01" min="0" value="{{ product.price|default:'' }}" required>
            </div>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ product.description|default:'' }}</textarea>
        </div>
        <div class="form-group form-check">
            <input type="checkbox" id="is_available" name="is_available" {% if product.is_available or not product %}checked{% endif %}>
            <label for="is_available">Available for ordering</label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
