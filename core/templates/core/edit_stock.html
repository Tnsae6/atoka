{% extends "core/base.html" %}
{% block title %}Edit Stock - {{ stock_item.name }} - Atoka{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Stock: {{ stock_item.name }}</h1>
</div>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="quantity">Current Quantity</label>
                <input type="number" id="quantity" name="quantity" step="0.01" min="0" value="{{ stock_item.quantity|floatformat:2 }}" required>
            </div>
            <div class="form-group">
                <label for="low_stock_threshold">Low Stock Threshold</label>
                <input type="number" id="low_stock_threshold" name="low_stock_threshold" step="0.01" min="0" value="{{ stock_item.low_stock_threshold|floatformat:2 }}">
            </div>
        </div>
        <div class="form-group">
            <label for="unit">Unit</label>
            <select id="unit" name="unit">
                {% for value, label in stock_item.UNIT_CHOICES %}
                <option value="{{ value }}" {% if stock_item.unit == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'stock_dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
