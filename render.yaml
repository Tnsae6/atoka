services:
  - type: web
    name: atoka
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python startup.py
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: atoka_project.settings
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: ALLOWED_HOSTS
        value: "atoka.onrender.com"
    autoDeploy: true
